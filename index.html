<script>
/* ================= JSONBin ================= */
const BIN_ID="6acb8e2dac6210605a27da2f";
const ACCESS_KEY="$2a$10$g1tvzfp2ZgMa7ShNHptVquVLyQj9ZBeheGObl1DPdABxCqMrCX4ey";
const API="https://api.jsonbin.io/v3/b/"+encodeURIComponent(BIN_ID);

const K={
 games:"mb_games",news:"mb_news",users:"mb_users",
 orders:"mb_orders",settings:"mb_settings",fav:"mb_fav"
};

const seedGames=[
{id:1,title:"رانندگان اروپا ۳",icon:"🚛",genre:"شبیه‌سازی",platform:"Android",version:"3.2",price:50000,old:70000,size:"180 MB",cover:"",desc:"صفحه محصول نمونه MB MODS. فقط فایل‌هایی را منتشر کنید که مجوز قانونی توزیع آن‌ها را دارید.",guide:"پس از دریافت فایل، طبق راهنمای نصب محصول عمل کنید.",file:""},
{id:2,title:"Minecraft",icon:"⛏️",genre:"Sandbox",platform:"Android / PC",version:"Demo",price:0,old:0,size:"—",cover:"",desc:"صفحه معرفی Minecraft.",guide:"برای نسخه قانونی از منبع رسمی بازی استفاده کنید.",file:""},
{id:3,title:"Among Us",icon:"👨‍🚀",genre:"Party",platform:"Android",version:"Latest",price:30000,old:45000,size:"—",cover:"",desc:"محصول نمونه.",guide:"راهنمای نصب محصول را قبل از انتشار تکمیل کنید.",file:""}
];
const seedNews=[
{id:1,title:"🚨 شروع رسمی MB MODS",text:"به MB MODS خوش آمدید؛ اخبار بازی و محصولات جدید اینجا منتشر می‌شوند.",date:"1405/07/12"},
{id:2,title:"🎮 بخش بازی‌ها فعال شد",text:"هر بازی می‌تواند صفحه اختصاصی، قیمت، مشخصات و راهنمای نصب داشته باشد.",date:"1405/07/13"}
];

let cloudReady=false;
let cloudSaving=false;
let cloudQueue=Promise.resolve();
let db={games:[],news:[]};

function get(k,d=[]){
 try{return JSON.parse(localStorage.getItem(k))??d}
 catch(e){return d}
}
function localSet(k,v){
 try{localStorage.setItem(k,JSON.stringify(v));return true}
 catch(e){toast("حافظه مرورگر پر شده است ❌");return false}
}
function set(k,v){
 const ok=localSet(k,v);
 if(ok&&cloudReady&&(k===K.games||k===K.news)){
  queueCloudSave(k,v);
 }
 return ok;
}
function esc(s=""){
 return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
}
function money(n){return Number(n)?Number(n).toLocaleString("fa-IR")+" تومان":"رایگان"}
function go(h){location.hash=h}
function toast(x){
 const t=document.getElementById("toast");t.textContent=x;t.classList.remove("hidden");
 setTimeout(()=>t.classList.add("hidden"),3000);
}
function validConfig(){
 return ACCESS_KEY.trim()!==""&&ACCESS_KEY!=="YOUR_ACCESS_KEY";
}
async function request(url,options={}){
 const r=await fetch(url,{
  ...options,
  headers:{"Content-Type":"application/json","X-Access-Key":ACCESS_KEY,...(options.headers||{})}
 });
 if(!r.ok)throw new Error("JSONBin HTTP "+r.status);
 return r.json();
}

/* هر بار فقط مجموعه تغییرکرده به Bin فرستاده می‌شود */
function queueCloudSave(collection,value){
 cloudQueue=cloudQueue.then(async()=>{
  if(!cloudReady)return;
  try{
   const latest=await request(API+"/latest");
   const record=latest.record||{};
   record.games=Array.isArray(record.games)?record.games:[];
   record.news=Array.isArray(record.news)?record.news:[];
   record[collection===K.games?"games":"news"]=value;
   record._mbInitialized=true;
   await request(API,{method:"PUT",body:JSON.stringify(record)});
   toast("اطلاعات آنلاین ذخیره شد ✅");
  }catch(e){
   console.error("JSONBin save error:",e);
   toast("ذخیره آنلاین ناموفق بود؛ کلید و اتصال را بررسی کن.");
  }
 });
}

/* بارگذاری داده‌های آنلاین */
async function loadCloud(){
 if(!validConfig()){
  document.getElementById("app").innerHTML=
  '<div class="notice">در ابتدای کد، YOUR_ACCESS_KEY را با کلید دسترسی JSONBin خودت جایگزین کن.</div>';
  return;
 }
 try{
  const result=await request(API+"/latest");
  const record=result.record||{};
  const initialized=record._mbInitialized===true;
  let games=Array.isArray(record.games)?record.games:null;
  let news=Array.isArray(record.news)?record.news:null;

  if(!initialized){
   const localGames=get(K.games,seedGames);
   const localNews=get(K.news,seedNews);
   if(!games||games.length===0)games=localGames.length?localGames:seedGames;
   if(!news||news.length===0)news=localNews.length?localNews:seedNews;
   const newRecord={...record,games,news,_mbInitialized:true};
   await request(API,{method:"PUT",body:JSON.stringify(newRecord)});
  }else{
   if(!games)games=[];
   if(!news)news=[];
  }

  db={games,news};
  localSet(K.games,games);
  localSet(K.news,news);
  cloudReady=true;
  render();
  toast("اتصال آنلاین برقرار شد ✅");
 }catch(e){
  console.error(e);
  document.getElementById("app").innerHTML=
   '<div class="notice">اتصال به JSONBin ناموفق بود. شناسه، کلید دسترسی و مجوزهای Bin را بررسی کن. خطا: '+esc(e.message)+'</div>';
 }
}

/* داده‌های محلی اولیه برای بقیه امکانات سایت */
if(!localStorage[K.games])localSet(K.games,seedGames);
if(!localStorage[K.news])localSet(K.news,seedNews);
if(!localStorage[K.users])localSet(K.users,[]);
if(!localStorage[K.orders])localSet(K.orders,[]);
if(!localStorage[K.fav])localSet(K.fav,[]);
if(!localStorage[K.settings])localSet(K.settings,{card:"",owner:"",account:"",phone:"",description:""});

function gameCard(g){
 return `<article class="card"><div class="cover">${g.cover?`<img src="${esc(g.cover)}" alt="">`:esc(g.icon||"🎮")}</div>
 <span class="tag">${esc(g.genre||"بازی")} • ${esc(g.platform||"—")}</span>
 <h3>${esc(g.title)}</h3><p class="muted">${esc(g.size||"—")} • نسخه ${esc(g.version||"—")}</p>
 <div class="price">${money(g.price)} ${g.old?`<span class="old">${money(g.old)}</span>`:""}</div>
 <button class="btn" onclick="go('#/games/${encodeURIComponent(g.id)}')">مشاهده بازی</button></article>`;
}
function home(){
 const games=get(K.games,seedGames),news=get(K.news,seedNews);
 return `<section class="hero"><h1>MB <span>MODS</span> 🎮</h1>
 <p>پورتال گیمینگ برای معرفی بازی‌ها، مودها، اخبار و محصولات دیجیتال.</p>
 <div class="actions"><button class="btn red" onclick="go('#/games')">🔥 ورود به بازی‌ها</button>
 <button class="btn dark" onclick="go('#/news')">📰 آخرین اخبار</button></div></section>
 <div class="section"><h2>🔥 بازی‌های ویژه</h2><div class="grid">${games.slice(0,6).map(gameCard).join("")||'<div class="notice">بازی‌ای منتشر نشده است.</div>'}</div></div>
 <div class="section"><h2>⚡ آخرین اخبار</h2><div class="grid">${news.slice(0,4).map(n=>`<article class="card"><span class="tag">${esc(n.date||"")}</span><h3>${esc(n.title)}</h3><p class="muted">${esc(n.text)}</p><button class="mini" onclick="go('#/news/${encodeURIComponent(n.id)}')">ادامه ←</button></article>`).join("")||'<div class="notice">خبری منتشر نشده است.</div>'}</div></div>`;
}
function games(){
 return `<h1>🎮 بازی‌ها</h1><input class="search" placeholder="نام بازی، ژانر یا پلتفرم..." oninput="filterGames(this.value)"><div id="gameGrid" class="grid">${get(K.games,seedGames).map(gameCard).join("")}</div>`;
}
function filterGames(q){
 const x=q.toLowerCase(),el=document.getElementById("gameGrid");if(!el)return;
 const gs=get(K.games,seedGames).filter(a=>(a.title+" "+a.genre+" "+a.platform).toLowerCase().includes(x));
 el.innerHTML=gs.map(gameCard).join("")||'<div class="notice">چیزی پیدا نشد 😐</div>';
}
function gameDetail(id){
 const g=get(K.games,seedGames).find(x=>String(x.id)===String(id));
 if(!g)return shell("خطا","بازی پیدا نشد.");
 const fav=get(K.fav);
 return `<div class="pagebox"><div class="cover" style="height:230px">${g.cover?`<img src="${esc(g.cover)}">`:esc(g.icon||"🎮")}</div>
 <h1>${esc(g.title)}</h1><p class="muted">${esc(g.desc||"")}</p>
 <div class="two"><div><b>ژانر:</b> ${esc(g.genre||"—")}<br><b>پلتفرم:</b> ${esc(g.platform||"—")}</div>
 <div><b>نسخه:</b> ${esc(g.version||"—")}<br><b>حجم:</b> ${esc(g.size||"—")}</div></div>
 <div class="price">${money(g.price)} ${g.old?`<span class="old">${money(g.old)}</span>`:""}</div>
 <div class="notice"><b>📘 راهنمای نصب:</b><br>${esc(g.guide||"راهنما موجود نیست.")}</div>
 <div class="actions">${g.price?`<button class="btn red" onclick="buy('${String(g.id).replace(/'/g,"")}')">🛒 خرید و ثبت سفارش</button>`:`<button class="btn" onclick="toast('برای دریافت، لینک رسمی محصول را بررسی کن.')">📥 دریافت</button>`}
 <button class="btn dark" onclick="toggleFav('${String(g.id).replace(/'/g,"")}')">${fav.some(x=>String(x)===String(g.id))?"💔 حذف از علاقه‌مندی":"❤️ علاقه‌مندی"}</button>
 ${g.file?`<a class="btn" href="${esc(g.file)}" target="_blank" rel="noopener">🔗 لینک محصول</a>`:""}</div></div>`;
}
function toggleFav(id){
 let f=get(K.fav);f=f.some(x=>String(x)===String(id))?f.filter(x=>String(x)!==String(id)):[...f,id];
 localSet(K.fav,f);toast("علاقه‌مندی به‌روزرسانی شد ❤️");render();
}
function favorites(){
 const f=get(K.fav),g=get(K.games,seedGames).filter(x=>f.some(id=>String(id)===String(x.id)));
 return `<h1>❤️ علاقه‌مندی‌ها</h1><div class="grid">${g.map(gameCard).join("")||'<div class="notice">هنوز بازی‌ای اضافه نکردی.</div>'}</div>`;
}
function news(){
 return `<h1>📰 اخبار</h1><div class="grid">${get(K.news,seedNews).map(n=>`<article class="card"><span class="tag">${esc(n.date||"")}</span><h2>${esc(n.title)}</h2><p class="muted">${esc(n.text)}</p><button class="btn" onclick="go('#/news/${encodeURIComponent(n.id)}')">خواندن خبر</button></article>`).join("")||'<div class="notice">خبری منتشر نشده است.</div>'}</div>`;
}
function newsDetail(id){
 const n=get(K.news,seedNews).find(x=>String(x.id)===String(id));
 if(!n)return shell("خطا","خبر پیدا نشد.");
 return `<div class="pagebox"><span class="tag">${esc(n.date||"")}</span><h1>${esc(n.title)}</h1><p class="muted" style="font-size:16px">${esc(n.text)}</p><button class="btn" onclick="go('#/news')">بازگشت</button></div>`;
}
function searchPage(){
 return `<h1>🔎 جستجوی سریع</h1><input class="search" placeholder="نام بازی یا خبر..." oninput="globalSearch(this.value)"><div id="results"></div>`;
}
function globalSearch(q){
 const r=document.getElementById("results");if(!r)return;if(!q){r.innerHTML="";return}
 const gs=get(K.games,seedGames).filter(x=>(x.title||"").toLowerCase().includes(q.toLowerCase()));
 const ns=get(K.news,seedNews).filter(x=>(x.title||"").toLowerCase().includes(q.toLowerCase()));
 r.innerHTML=`<h3>🎮 بازی‌ها</h3><div class="grid">${gs.map(gameCard).join("")||"موردی نیست"}</div><h3>📰 اخبار</h3><div class="grid">${ns.map(n=>`<div class="notice">${esc(n.title)} <button class="mini" onclick="go('#/news/${encodeURIComponent(n.id)}')">باز کن</button></div>`).join("")||"موردی نیست"}</div>`;
}
function register(){
 return `<div class="pagebox"><h1>📝 ساخت حساب</h1><form class="form" onsubmit="doRegister(event)">
 <input id="regName" required placeholder="نام کاربری"><input id="regPhone" required placeholder="شماره موبایل"><input id="regPass" required type="password" placeholder="رمز عبور">
 <label><input id="regAgree" type="checkbox" required> قوانین سایت را قبول دارم.</label><button class="btn">ساخت حساب</button></form>
 <p class="muted">این حساب نمایشی است و فقط در همین مرورگر ذخیره می‌شود.</p></div>`;
}
function doRegister(e){
 e.preventDefault();const users=get(K.users),name=document.getElementById("regName").value.trim();
 if(users.some(x=>x.name===name)){toast("این نام کاربری وجود دارد.");return}
 users.push({id:Date.now(),name,phone:document.getElementById("regPhone").value,pass:document.getElementById("regPass").value});
 localSet(K.users,users);toast("حساب ساخته شد ✅");go("#/login");
}
function login(){
 return `<div class="pagebox"><h1>🔐 ورود</h1><form class="form" onsubmit="doLogin(event)">
 <input id="loginName" required placeholder="نام کاربری"><input id="loginPass" required type="password" placeholder="رمز عبور"><button class="btn">ورود</button></form>
 <br><button class="mini" onclick="go('#/register')">ساخت حساب جدید</button></div>`;
}
function doLogin(e){
 e.preventDefault();const name=document.getElementById("loginName").value,pass=document.getElementById("loginPass").value;
 const u=get(K.users).find(x=>x.name===name&&x.pass===pass);
 if(!u){toast("نام کاربری یا رمز اشتباه است ❌");return}
 localStorage.mbUser=JSON.stringify(u);toast("خوش آمدی 🎮");go("#/home");
}
function buy(id){
 if(!localStorage.mbUser){toast("ابتدا وارد حساب شوید 🔐");go("#/login");return}
 const g=get(K.games,seedGames).find(x=>String(x.id)===String(id));if(!g)return;
 if(!g.price){toast("این محصول رایگان است.");return}
 const orders=get(K.orders),u=JSON.parse(localStorage.mbUser);
 orders.push({id:Date.now(),gameId:g.id,user:u.name,amount:g.price,status:"pending",receipt:"",date:new Date().toLocaleString("fa-IR")});
 localSet(K.orders,orders);toast("سفارش ثبت شد 🛒");go("#/orders");
}
function statusText(s){return {pending:"منتظر پرداخت",review:"در حال بررسی رسید",paid:"پرداخت تأیید شد",rejected:"رسید رد شد"}[s]||s}
function orders(){
 if(!localStorage.mbUser)return shell("🔐 سفارش‌ها",`<p>برای دیدن سفارش‌ها وارد حساب شوید.</p><button class="btn" onclick="go('#/login')">ورود</button>`);
 const user=JSON.parse(localStorage.mbUser).name,os=get(K.orders).filter(x=>x.user===user),s=get(K.settings);
 return `<h1>🛒 سفارش‌های من</h1><div class="notice"><b>💳 اطلاعات پرداخت</b><br><br>${s.card?`شماره کارت: <b>${esc(s.card)}</b><br>صاحب حساب: <b>${esc(s.owner)}</b><br>${s.account?`شماره حساب: <b>${esc(s.account)}</b><br>`:""}`:"اطلاعات پرداخت هنوز تنظیم نشده است."}<br>${esc(s.description||"")}</div>
 <div class="grid">${os.map(o=>{const g=get(K.games,seedGames).find(x=>String(x.id)===String(o.gameId));return `<article class="card"><h3>${esc(g?.title||"محصول حذف‌شده")}</h3><div class="price">${money(o.amount)}</div><p class="muted">کد سفارش: ${o.id}<br>تاریخ: ${esc(o.date)}<br>وضعیت: <b>${statusText(o.status)}</b></p>${o.status==="pending"?`<button class="btn" onclick="uploadReceipt(${o.id})">📸 ارسال رسید</button>`:""}${o.status==="paid"&&g?.file?`<a class="btn" href="${esc(g.file)}" target="_blank" rel="noopener">📥 لینک محصول</a>`:""}</article>`}).join("")||'<div class="notice">هنوز سفارشی نداری.</div>'}</div>`;
}
function uploadReceipt(id){
 const input=document.createElement("input");input.type="file";input.accept="image/*,.pdf";
 input.onchange=()=>{const file=input.files[0];if(!file)return;if(file.size>1200*1024){toast("رسید باید کمتر از 1.2MB باشد.");return}
 const reader=new FileReader();reader.onload=()=>{const os=get(K.orders),o=os.find(x=>x.id==id);if(!o)return;o.receipt=reader.result;o.status="review";localSet(K.orders,os);toast("رسید در این مرورگر ثبت شد.");render()};reader.readAsDataURL(file)};
 input.click();
}
function adminLogin(){
 return `<div class="pagebox"><h1>🔐 ورود مدیر</h1><form class="form" onsubmit="doAdminLogin(event)">
 <input id="adminName" required autocomplete="username" placeholder="👤 نام کاربری مدیر"><input id="adminPass" required type="password" autocomplete="current-password" placeholder="🔑 رمز عبور">
 <button class="btn red">🚀 ورود به پنل مدیریت</button></form><p class="muted">ورود سمت مرورگر است و امنیت واقعی ایجاد نمی‌کند.</p></div>`;
}
function doAdminLogin(e){
 e.preventDefault();const n=document.getElementById("adminName").value,p=document.getElementById("adminPass").value;
 if(n==="admin"&&p==="MBMODS@2026"){localStorage.mbAdmin="1";toast("ورود موفق بود 👑");go("#/admin")}
 else toast("اطلاعات مدیریت اشتباه است ❌");
}
function admin(){
 if(!localStorage.mbAdmin){go("#/admin/login");return ""}
 const games=get(K.games,seedGames),news=get(K.news,seedNews),orders=get(K.orders),users=get(K.users);
 return `<h1>👑 پنل مدیریت MB MODS</h1><div class="adminnav">
 <button class="mini" onclick="go('#/admin')">📊 داشبورد</button><button class="mini" onclick="go('#/admin/games')">🎮 بازی‌ها</button><button class="mini" onclick="go('#/admin/news')">📰 اخبار</button>
 <button class="mini" onclick="go('#/admin/orders')">🛒 سفارش‌ها</button><button class="mini" onclick="go('#/admin/users')">👥 کاربران</button><button class="mini" onclick="go('#/admin/settings')">💳 تنظیمات پرداخت</button><button class="mini" onclick="adminLogout()">🚪 خروج</button></div>
 <div class="grid"><div class="card"><h2>🎮 ${games.length}</h2><p class="muted">بازی</p></div><div class="card"><h2>📰 ${news.length}</h2><p class="muted">خبر</p></div><div class="card"><h2>🛒 ${orders.length}</h2><p class="muted">سفارش محلی</p></div><div class="card"><h2>👥 ${users.length}</h2><p class="muted">کاربر محلی</p></div></div>
 <div class="notice">${cloudReady?"اتصال JSONBin برقرار است. تغییرات بازی‌ها و اخبار آنلاین ذخیره می‌شوند.":"در حال اتصال به JSONBin..."}</div>`;
}
function adminLogout(){localStorage.removeItem("mbAdmin");toast("خارج شدی.");go("#/home")}
function adminGames(){
 if(!localStorage.mbAdmin)return adminLogin();
 const gs=get(K.games,seedGames);
 return `<div class="pagebox"><h1>🎮 مدیریت بازی‌ها</h1>
 <form class="form" onsubmit="addGame(event)">
 <input id="gTitle" required placeholder="نام بازی"><div class="two"><input id="gGenre" placeholder="ژانر"><input id="gPlatform" placeholder="پلتفرم"></div>
 <div class="two"><input id="gVersion" placeholder="نسخه"><input id="gSize" placeholder="حجم"></div><div class="two"><input id="gPrice" type="number" min="0" placeholder="قیمت تومان"><input id="gOld" type="number" min="0" placeholder="قیمت قبلی"></div>
 <input id="gIcon" placeholder="ایموجی آیکون، مثلاً 🎮"><label>🖼️ لینک تصویر کاور (URL)</label><input id="gCover" type="url" placeholder="https://...">
 <textarea id="gDesc" placeholder="توضیحات کامل بازی"></textarea><textarea id="gGuide" placeholder="راهنمای نصب"></textarea><input id="gFile" type="url" placeholder="لینک دانلود/محصول">
 <button class="btn red">➕ افزودن محصول</button></form>
 <div class="notice">بازی‌ها و اخبار در JSONBin ذخیره می‌شوند. لینک فایل یا تصویر باید از یک نشانی عمومی قابل دسترسی باشد.</div><hr><div class="grid">
 ${gs.map(g=>`<article class="card"><div class="cover">${g.cover?`<img src="${esc(g.cover)}">`:esc(g.icon||"🎮")}</div><h3>${esc(g.title)}</h3><div class="price">${money(g.price)}</div><div class="actions"><button class="mini" onclick="editGame('${String(g.id).replace(/'/g,"")}')">✏️ ویرایش</button><button class="mini danger" onclick="deleteGame('${String(g.id).replace(/'/g,"")}')">🗑️ حذف</button></div></article>`).join("")}
 </div></div>`;
}
function addGame(e){
 e.preventDefault();
 const gs=get(K.games,seedGames);
 gs.unshift({id:Date.now(),title:document.getElementById("gTitle").value.trim(),genre:document.getElementById("gGenre").value,platform:document.getElementById("gPlatform").value,version:document.getElementById("gVersion").value,size:document.getElementById("gSize").value,price:Number(document.getElementById("gPrice").value)||0,old:Number(document.getElementById("gOld").value)||0,icon:document.getElementById("gIcon").value||"🎮",cover:document.getElementById("gCover").value.trim(),desc:document.getElementById("gDesc").value,guide:document.getElementById("gGuide").value,file:document.getElementById("gFile").value.trim()});
 if(set(K.games,gs)){toast("بازی ثبت شد؛ در حال ذخیره آنلاین...");go("#/admin/games")}
}
function editGame(id){
 const gs=get(K.games,seedGames),g=gs.find(x=>String(x.id)===String(id));if(!g)return;
 const title=prompt("نام بازی:",g.title);if(title===null)return;
 const price=prompt("قیمت تومان:",g.price);if(price===null)return;
 const desc=prompt("توضیحات:",g.desc||"");if(desc===null)return;
 g.title=title.trim();g.price=Number(price)||0;g.desc=desc;
 set(K.games,gs);toast("ویرایش ثبت شد؛ در حال ذخیره آنلاین...");render();
}
function deleteGame(id){
 if(!confirm("این بازی حذف شود؟"))return;
 set(K.games,get(K.games,seedGames).filter(x=>String(x.id)!==String(id)));
 toast("درخواست حذف ثبت شد.");render();
}
function adminNews(){
 if(!localStorage.mbAdmin)return adminLogin();
 return `<div class="pagebox"><h1>📰 مدیریت اخبار</h1><form class="form" onsubmit="addNews(event)">
 <input id="nTitle" required placeholder="عنوان خبر"><input id="nDate" placeholder="تاریخ"><textarea id="nText" required placeholder="متن خبر"></textarea>
 <button class="btn">➕ انتشار خبر</button></form><hr>
 ${get(K.news,seedNews).map(n=>`<div class="notice"><b>${esc(n.title)}</b><p class="muted">${esc(n.text)}</p><div class="actions"><button class="mini" onclick="editNews('${String(n.id).replace(/'/g,"")}')">✏️ ویرایش</button><button class="mini danger" onclick="deleteNews('${String(n.id).replace(/'/g,"")}')">🗑️ حذف</button></div></div>`).join("")}</div>`;
}
function addNews(e){
 e.preventDefault();const ns=get(K.news,seedNews);
 ns.unshift({id:Date.now(),title:document.getElementById("nTitle").value.trim(),date:document.getElementById("nDate").value||new Date().toLocaleDateString("fa-IR"),text:document.getElementById("nText").value.trim()});
 set(K.news,ns);toast("خبر ثبت شد؛ در حال ذخیره آنلاین...");go("#/admin/news");
}
function editNews(id){
 const ns=get(K.news,seedNews),n=ns.find(x=>String(x.id)===String(id));if(!n)return;
 const title=prompt("عنوان خبر:",n.title);if(title===null)return;
 const text=prompt("متن خبر:",n.text);if(text===null)return;
 n.title=title.trim();n.text=text;set(K.news,ns);toast("ویرایش خبر ثبت شد.");render();
}
function deleteNews(id){
 if(!confirm("خبر حذف شود؟"))return;
 set(K.news,get(K.news,seedNews).filter(x=>String(x.id)!==String(id)));
 toast("درخواست حذف خبر ثبت شد.");render();
}
function adminOrders(){
 if(!localStorage.mbAdmin)return adminLogin();
 const os=get(K.orders);
 return `<div class="pagebox"><h1>🛒 سفارش‌های این مرورگر</h1>
 ${os.length?`<table><thead><tr><th>کد</th><th>کاربر</th><th>مبلغ</th><th>وضعیت</th><th>عملیات</th></tr></thead><tbody>
 ${os.map(o=>`<tr><td>${o.id}</td><td>${esc(o.user)}</td><td>${money(o.amount)}</td><td>${statusText(o.status)}</td><td>${o.receipt?`<button class="mini" onclick="showReceipt(${o.id})">📸 رسید</button>`:"بدون رسید"} ${o.status==="review"?`<button class="mini" onclick="approveOrder(${o.id})">✅ تأیید</button><button class="mini danger" onclick="rejectOrder(${o.id})">❌ رد</button>`:""}</td></tr>`).join("")}</tbody></table>`:'<div class="notice">سفارشی وجود ندارد.</div>'}
 <p class="muted">سفارش‌ها و رسیدها در این نسخه آنلاین و مشترک بین همه دستگاه‌ها نیستند.</p></div>`;
}
function showReceipt(id){
 const o=get(K.orders).find(x=>x.id==id);if(!o?.receipt){toast("رسیدی وجود ندارد.");return}
 const w=window.open();if(!w){toast("مرورگر اجازه پنجره جدید نداد.");return}
 w.document.write(`<title>رسید ${id}</title><body style="background:#111;color:white;text-align:center"><h2>رسید سفارش ${id}</h2><img src="${o.receipt}" style="max-width:95%;max-height:85vh"></body>`);
}
function approveOrder(id){const os=get(K.orders),o=os.find(x=>x.id==id);if(!o)return;o.status="paid";localSet(K.orders,os);toast("سفارش در این مرورگر تأیید شد.");render()}
function rejectOrder(id){const os=get(K.orders),o=os.find(x=>x.id==id);if(!o)return;o.status="rejected";localSet(K.orders,os);toast("وضعیت سفارش تغییر کرد.");render()}
function adminUsers(){
 if(!localStorage.mbAdmin)return adminLogin();const us=get(K.users);
 return `<div class="pagebox"><h1>👥 کاربران محلی</h1><table><thead><tr><th>نام</th><th>موبایل</th><th>عملیات</th></tr></thead><tbody>${us.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.phone)}</td><td><button class="mini danger" onclick="deleteUser(${u.id})">حذف</button></td></tr>`).join("")}</tbody></table><p class="muted">کاربران این بخش فقط در حافظه همین مرورگر ذخیره می‌شوند.</p></div>`;
}
function deleteUser(id){if(!confirm("کاربر حذف شود؟"))return;localSet(K.users,get(K.users).filter(x=>x.id!=id));toast("کاربر حذف شد.");render()}
function adminSettings(){
 if(!localStorage.mbAdmin)return adminLogin();const s=get(K.settings);
 return `<div class="pagebox"><h1>💳 تنظیمات پرداخت</h1><div class="notice">تنظیمات زیر فقط در همین مرورگر ذخیره می‌شوند.</div>
 <form class="form" onsubmit="saveSettings(event)"><label>💳 شماره کارت</label><input id="payCard" inputmode="numeric" placeholder="شماره کارت" value="${esc(s.card)}">
 <label>👤 نام صاحب کارت</label><input id="payOwner" placeholder="نام صاحب کارت" value="${esc(s.owner)}">
 <label>🏦 شماره حساب</label><input id="payAccount" placeholder="اختیاری" value="${esc(s.account)}">
 <label>📱 شماره تماس</label><input id="payPhone" placeholder="اختیاری" value="${esc(s.phone)}">
 <label>📝 توضیح پرداخت</label><textarea id="payDesc">${esc(s.description)}</textarea><button class="btn red">💾 ذخیره تنظیمات</button></form>
 <br><button class="mini danger" onclick="resetAll()">⚠️ پاک کردن اطلاعات محلی</button></div>`;
}
function saveSettings(e){
 e.preventDefault();localSet(K.settings,{card:document.getElementById("payCard").value.trim(),owner:document.getElementById("payOwner").value.trim(),account:document.getElementById("payAccount").value.trim(),phone:document.getElementById("payPhone").value.trim(),description:document.getElementById("payDesc").value.trim()});
 toast("تنظیمات محلی ذخیره شد.");go("#/admin/settings");
}
function resetAll(){
 if(!confirm("اطلاعات محلی این مرورگر پاک شود؟ اطلاعات JSONBin حذف نمی‌شود."))return;
 Object.values(K).forEach(k=>localStorage.removeItem(k));localStorage.removeItem("mbUser");localStorage.removeItem("mbAdmin");location.reload();
}
function profile(){
 if(!localStorage.mbUser)return shell("👤 حساب",`<button class="btn" onclick="go('#/login')">ورود</button>`);
 const u=JSON.parse(localStorage.mbUser);
 return `<div class="pagebox"><h1>👤 پروفایل</h1><div class="notice">نام کاربری: <b>${esc(u.name)}</b><br>موبایل: <b>${esc(u.phone)}</b></div><button class="btn red" onclick="logoutUser()">🚪 خروج</button></div>`;
}
function logoutUser(){localStorage.removeItem("mbUser");toast("از حساب خارج شدی.");go("#/home")}
function shell(title,body){return `<div class="pagebox"><h1>${title}</h1>${body}</div>`}
function render(){
 const hash=location.hash||"#/home",p=hash.replace(/^#\//,"").split("/");let html="";
 if(p[0]==="home"||!p[0])html=home();
 else if(p[0]==="games"&&p[1])html=gameDetail(decodeURIComponent(p[1]));
 else if(p[0]==="games")html=games();
 else if(p[0]==="news"&&p[1])html=newsDetail(decodeURIComponent(p[1]));
 else if(p[0]==="news")html=news();
 else if(p[0]==="search")html=searchPage();
 else if(p[0]==="favorites")html=favorites();
 else if(p[0]==="login")html=login();
 else if(p[0]==="register")html=register();
 else if(p[0]==="orders")html=orders();
 else if(p[0]==="profile")html=profile();
 else if(p[0]==="admin"&&!p[1])html=admin();
 else if(p[0]==="admin"&&p[1]==="login")html=adminLogin();
 else if(p[0]==="admin"&&p[1]==="games"){if(!localStorage.mbAdmin){go("#/admin/login");return}html=adminGames()}
 else if(p[0]==="admin"&&p[1]==="news"){if(!localStorage.mbAdmin){go("#/admin/login");return}html=adminNews()}
 else if(p[0]==="admin"&&p[1]==="orders"){if(!localStorage.mbAdmin){go("#/admin/login");return}html=adminOrders()}
 else if(p[0]==="admin"&&p[1]==="users"){if(!localStorage.mbAdmin){go("#/admin/login");return}html=adminUsers()}
 else if(p[0]==="admin"&&p[1]==="settings"){if(!localStorage.mbAdmin){go("#/admin/login");return}html=adminSettings()}
 else html=home();
 document.getElementById("app").innerHTML=html;
}
window.addEventListener("hashchange",render);
render();
loadCloud();
</script>
</body>
 </html>

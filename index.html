<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090d18">
<title>MB MODS | دنیای گیم</title>
<meta name="description" content="MB MODS؛ دنیای بازی‌ها، اخبار گیم و بازی‌های مود شده">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#090d18;--panel:#121a2b;--panel2:#19243a;--text:#f4f7ff;--muted:#9ba9c3;--green:#48f5a5;--blue:#628cff;--red:#ff6075}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at top,#152747,var(--bg) 55%);color:var(--text);font-family:Vazirmatn,Tahoma,sans-serif;min-height:100vh}
button,input,textarea,select{font:inherit}
button{cursor:pointer;border:0}
a{color:inherit;text-decoration:none}
header{position:sticky;top:0;z-index:10;background:#090d18ed;border-bottom:1px solid #29344b;backdrop-filter:blur(14px)}
.top{max-width:1100px;margin:auto;padding:15px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.logo{font-size:24px;font-weight:800;color:var(--green)}
nav{display:flex;gap:7px;flex-wrap:wrap}
nav button,.btn{background:var(--panel2);color:white;padding:9px 13px;border-radius:11px}
nav button:hover,.btn:hover{background:#2b3c5b}
main{max-width:1100px;margin:auto;padding:20px 15px 90px}
.hero{padding:35px 25px;border:1px solid #30435f;border-radius:24px;background:linear-gradient(125deg,#152b47,#111729 65%,#173c38);margin-bottom:25px}
.hero h1{font-size:clamp(27px,5vw,44px);margin:0 0 10px}
.hero p{color:var(--muted);line-height:2}
.green{color:var(--green)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px;margin:18px 0 28px}
.card{background:linear-gradient(145deg,var(--panel2),var(--panel));border:1px solid #293851;border-radius:17px;overflow:hidden}
.card img{width:100%;height:150px;object-fit:cover;background:#0b1120}
.pad{padding:15px}
.card h3{margin:0 0 8px}
.muted{color:var(--muted);font-size:14px;line-height:1.9}
.price{color:var(--green);font-weight:800;margin:10px 0}
.primary{background:var(--green);color:#07140e;font-weight:800;padding:10px 15px;border-radius:10px}
.danger{background:#562637;color:#fff;padding:8px 12px;border-radius:9px}
.field{width:100%;padding:12px;margin:6px 0 13px;background:#080e1b;color:white;border:1px solid #35445e;border-radius:10px}
textarea.field{min-height:90px;resize:vertical}
.panel{padding:18px;background:var(--panel);border:1px solid #293851;border-radius:16px;margin:15px 0}
section h2{font-size:23px}
.tag{display:inline-block;color:var(--green);background:#16372f;padding:4px 9px;border-radius:8px;font-size:12px}
#toast{position:fixed;bottom:20px;left:15px;right:15px;margin:auto;max-width:500px;background:#24344c;padding:13px 16px;border-radius:12px;display:none;z-index:30}
footer{text-align:center;padding:25px;color:var(--muted);border-top:1px solid #253047}
.small{font-size:12px;color:var(--muted)}
.hide{display:none!important}
@media(max-width:500px){.hero{padding:25px 17px}nav button{padding:8px;font-size:13px}.logo{font-size:20px}}
</style>
</head>
<body>
<header>
 <div class="top">
  <a class="logo" href="#" onclick="go('home');return false">🎮 MB MODS</a>
  <nav>
   <button onclick="go('home')">🏠 خانه</button>
   <button onclick="go('games')">🎮 بازی‌ها</button>
   <button onclick="go('news')">📰 اخبار</button>
   <button onclick="go('favorites')">❤️ علاقه‌مندی</button>
   <button onclick="go('admin')">🛠 مدیریت</button>
  </nav>
 </div>
</header>
<main>
 <div id="app"><p>در حال بارگذاری MB MODS...</p></div>
</main>
<footer>© MB MODS — دنیای بازی‌ها و اخبار گیم 🎮</footer>
<div id="toast"></div>
<script>
/* تنظیمات پروژه Supabase */
const SUPABASE_URL = "https://sqhhqsicpzamcnmdinmf.supabase.co";
const SUPABASE_KEY = "sb_publishable_Eq4FXs4POYmtEjER5v0TYQ_p6buN6i1";

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const app = document.getElementById("app");
let games=[], news=[], currentPage="home", searchText="";
let favorites=JSON.parse(localStorage.getItem("mb_fav")||"[]");
let session=null, isAdmin=false;

function esc(v=""){
 return String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function toast(msg){
 const el=document.getElementById("toast");
 el.textContent=msg;el.style.display="block";
 clearTimeout(window.toastTimer);
 window.toastTimer=setTimeout(()=>el.style.display="none",3500);
}
function go(page){currentPage=page;render();}
function money(n){return Number(n||0).toLocaleString("fa-IR")+" تومان";}
function imgUrl(item){
 return item.image_url||item.image||"https://placehold.co/600x350/121a2b/48f5a5?text=MB+MODS";
}
function gameCard(g){
 const id=g.id;
 return `<article class="card">
 <img src="${esc(imgUrl(g))}" alt="${esc(g.title)}" loading="lazy" onerror="this.src='https://placehold.co/600x350/121a2b/48f5a5?text=MB+MODS'">
 <div class="pad">
 <span class="tag">${g.is_vip?"VIP":"بازی"}</span>
 <h3>${esc(g.title||"بدون عنوان")}</h3>
 <div class="muted">${esc(g.description||"برای مشاهده جزئیات بازی")}</div>
 <div class="price">${Number(g.price||0)===0?"رایگان":money(g.price)}</div>
 <div class="row">
 <button class="primary" onclick="openGame('${esc(id)}')">مشاهده / دانلود</button>
 <button class="btn" onclick="toggleFav('${esc(id)}')">${favorites.includes(String(id))?"❤️":"🤍"}</button>
 </div>
 </div></article>`;
}
function newsCard(n){
 return `<article class="card"><div class="pad">
 <span class="tag">📰 خبر گیم</span><h3>${esc(n.title||"خبر جدید")}</h3>
 <p class="muted">${esc(n.description||n.content||"")}</p>
 <span class="small">${n.created_at?new Date(n.created_at).toLocaleDateString("fa-IR"):"MB MODS"}</span>
 </div></article>`;
}
async function loadData(){
 const [gr,nr]=await Promise.all([
  db.from("games").select("*").eq("published",true).order("created_at",{ascending:false}),
  db.from("news").select("*").eq("published",true).order("created_at",{ascending:false})
 ]);
 if(gr.error) console.error("Games:",gr.error.message);
 if(nr.error) console.error("News:",nr.error.message);
 games=gr.error?[]:(gr.data||[]);
 news=nr.error?[]:(nr.data||[]);
 render();
}
function render(){
 if(currentPage==="admin"){renderAdmin();return;}
 if(currentPage==="game"){return;}
 let html="";
 if(currentPage==="home"){
  html=`<div class="hero">
  <span class="tag">WELCOME TO MB MODS</span>
  <h1>به دنیای <span class="green">گیم‌ها</span> خوش آمدی! 🎮</h1>
  <p>بازی‌ها، اخبار جدید گیم و دنیایی از سرگرمی را در MB MODS دنبال کن.</p>
  <button class="primary" onclick="go('games')">مشاهده بازی‌ها</button>
  <button class="btn" onclick="go('news')">آخرین اخبار</button>
  </div>
  <div class="panel"><div class="row"><h2>🎮 بازی‌های جدید</h2><button class="btn" onclick="go('games')">همه بازی‌ها ←</button></div>
  <div class="grid">${games.slice(0,4).map(gameCard).join("")||'<p class="muted">فعلاً بازی منتشرشده‌ای ثبت نشده است.</p>'}</div></div>
  <div class="panel"><div class="row"><h2>📰 آخرین اخبار</h2><button class="btn" onclick="go('news')">همه اخبار ←</button></div>
  <div class="grid">${news.slice(0,3).map(newsCard).join("")||'<p class="muted">هنوز خبری منتشر نشده است.</p>'}</div></div>`;
 }else if(currentPage==="games"){
  const list=games.filter(g=>(g.title||"").toLowerCase().includes(searchText.toLowerCase()));
  html=`<h2>🎮 همه بازی‌ها</h2><input class="field" placeholder="جست‌وجوی بازی..." value="${esc(searchText)}" oninput="searchText=this.value;render()">
  <div class="grid">${list.map(gameCard).join("")||'<p class="muted">بازی‌ای پیدا نشد.</p>'}</div>`;
 }else if(currentPage==="news"){
  html=`<h2>📰 اخبار گیم</h2><div class="grid">${news.map(newsCard).join("")||'<p class="muted">هنوز خبری منتشر نشده است.</p>'}</div>`;
 }else if(currentPage==="favorites"){
  html=`<h2>❤️ علاقه‌مندی‌های من</h2><div class="grid">${games.filter(g=>favorites.includes(String(g.id))).map(gameCard).join("")||'<p class="muted">هنوز بازی‌ای به علاقه‌مندی‌ها اضافه نکردی.</p>'}</div>`;
 }
 app.innerHTML=html;
}
function toggleFav(id){
 id=String(id);
 favorites=favorites.includes(id)?favorites.filter(x=>x!==id):[...favorites,id];
 localStorage.setItem("mb_fav",JSON.stringify(favorites));render();
}
function openGame(id){
 const g=games.find(x=>String(x.id)===String(id));
 if(!g)return toast("بازی پیدا نشد.");
 app.innerHTML=`<button class="btn" onclick="go('games')">← بازگشت</button>
 <div class="panel"><img style="width:100%;max-height:330px;object-fit:cover;border-radius:13px" src="${esc(imgUrl(g))}">
 <h2>${esc(g.title)}</h2><p class="muted">${esc(g.description||"")}</p>
 <p class="price">${Number(g.price||0)===0?"رایگان":money(g.price)}</p>
 ${g.game_url?`<a class="primary" href="${esc(g.game_url)}" target="_blank" rel="noopener noreferrer">⬇️ دریافت بازی</a>`:'<p class="muted">لینک دانلود هنوز اضافه نشده است.</p>'}
 <button class="btn" onclick="toggleFav('${esc(g.id)}')">❤️ علاقه‌مندی</button></div>`;
 currentPage="game";
}

/* ورود امن مدیر با لینک ایمیلی Supabase */
async function renderAdmin(){
 const {data,error}=await db.auth.getSession();
 if(error)console.error(error);
 session=data.session;
 if(!session){
  app.innerHTML=`<div class="panel"><h2>🛠 پنل مدیریت MB MODS</h2>
  <p class="muted">ایمیل مدیر را وارد کن. یک لینک ورود از طریق ایمیل برایت ارسال می‌شود؛ نیازی به رمز عبور نیست.</p>
  <form onsubmit="sendLogin(event)">
  <label>ایمیل مدیر</label><input class="field" id="adminEmail" type="email" required placeholder="ایمیل حساب مدیر">
  <button class="primary">ارسال لینک ورود</button></form>
  <p class="small">فقط ایمیل‌هایی که در پروژه Supabase مجاز هستند می‌توانند وارد شوند.</p></div>`;
  return;
 }
 const {data:roleData,error:roleError}=await db.from("user_roles").select("role").eq("user_id",session.user.id).maybeSingle();
 if(roleError)console.error("Admin role:",roleError.message);
 isAdmin=!!roleData&&roleData.role==="admin";
 if(!isAdmin){
  app.innerHTML=`<div class="panel"><h2>دسترسی مدیر تأیید نشد</h2><p class="muted">این حساب در جدول user_roles نقش admin ندارد.</p><button class="danger" onclick="logout()">خروج</button></div>`;
  return;
 }
 app.innerHTML=`<div class="row"><h2>🛠 مدیریت MB MODS</h2><button class="danger" onclick="logout()">خروج</button></div>
 <p class="muted">وارد شده: ${esc(session.user.email)}</p>
 <div class="panel"><h3>➕ افزودن بازی</h3>
 <form onsubmit="addGame(event)">
 <label>نام بازی</label><input class="field" id="gTitle" required>
 <label>توضیحات</label><textarea class="field" id="gDesc"></textarea>
 <label>لینک تصویر</label><input class="field" id="gImage" type="url" placeholder="https://...">
 <label>لینک دانلود</label><input class="field" id="gUrl" type="url" placeholder="https://...">
 <label>قیمت به تومان (برای رایگان ۰)</label><input class="field" id="gPrice" type="number" min="0" value="0">
 <label><input id="gVip" type="checkbox"> بازی ویژه VIP</label><br><br>
 <label><input id="gPublished" type="checkbox" checked> انتشار بازی</label><br><br>
 <button class="primary">ثبت بازی در Supabase</button></form></div>
 <div class="panel"><h3>➕ افزودن خبر</h3>
 <form onsubmit="addNews(event)">
 <label>عنوان خبر</label><input class="field" id="nTitle" required>
 <label>متن خبر</label><textarea class="field" id="nDesc" required></textarea>
 <label><input id="nPublished" type="checkbox" checked> انتشار خبر</label><br><br>
 <button class="primary">ثبت خبر در Supabase</button></form></div>
 <div class="panel"><h3>🎮 مدیریت بازی‌ها</h3>
 ${games.map(g=>`<div class="row" style="padding:10px 0;border-bottom:1px solid #293851"><span>${esc(g.title)} <span class="small">${g.published?"منتشرشده":"پیش‌نویس"}</span></span><button class="danger" onclick="deleteGame('${esc(g.id)}')">حذف</button></div>`).join("")||'<p class="muted">بازی‌ای ثبت نشده است.</p>'}
 </div>
 <div class="panel"><h3>📰 مدیریت اخبار</h3>
 ${news.map(n=>`<div class="row" style="padding:10px 0;border-bottom:1px solid #293851"><span>${esc(n.title)}</span><button class="danger" onclick="deleteNews('${esc(n.id)}')">حذف</button></div>`).join("")||'<p class="muted">خبری ثبت نشده است.</p>'}
 </div>`;
}
async function sendLogin(e){
 e.preventDefault();
 const email=document.getElementById("adminEmail").value.trim();
 const {error}=await db.auth.signInWithOtp({
  email,
  options:{emailRedirectTo:location.origin+location.pathname}
 });
 if(error)return toast("خطا در ارسال لینک: "+error.message);
 toast("لینک ورود ارسال شد؛ ایمیلت را بررسی کن.");
}
async function logout(){
 await db.auth.signOut();session=null;isAdmin=false;toast("از حساب خارج شدی.");renderAdmin();
}
async function checkAdmin(){
 const {data}=await db.auth.getSession();
 session=data.session;
 if(!session)return false;
 const {data:role,error}=await db.from("user_roles").select("role").eq("user_id",session.user.id).maybeSingle();
 if(error){toast("بررسی دسترسی ناموفق بود.");return false;}
 return !!role&&role.role==="admin";
}
async function addGame(e){
 e.preventDefault();
 if(!await checkAdmin())return toast("دسترسی مدیر تأیید نشد.");
 const row={
  title:document.getElementById("gTitle").value.trim(),
  description:document.getElementById("gDesc").value.trim(),
  image_url:document.getElementById("gImage").value.trim()||null,
  game_url:document.getElementById("gUrl").value.trim()||null,
  price:Number(document.getElementById("gPrice").value||0),
  is_vip:document.getElementById("gVip").checked,
  published:document.getElementById("gPublished").checked
 };
 const {error}=await db.from("games").insert(row);
 if(error)return toast("ثبت بازی ناموفق بود: "+error.message);
 toast("بازی ثبت شد.");await loadData();go("admin");
}
async function addNews(e){
 e.preventDefault();
 if(!await checkAdmin())return toast("دسترسی مدیر تأیید نشد.");
 const row={
  title:document.getElementById("nTitle").value.trim(),
  description:document.getElementById("nDesc").value.trim(),
  published:document.getElementById("nPublished").checked
 };
 const {error}=await db.from("news").insert(row);
 if(error)return toast("ثبت خبر ناموفق بود: "+error.message);
 toast("خبر ثبت شد.");await loadData();go("admin");
}
async function deleteGame(id){
 if(!confirm("این بازی حذف شود؟"))return;
 if(!await checkAdmin())return toast("دسترسی مدیر تأیید نشد.");
 const {error}=await db.from("games").delete().eq("id",id);
 if(error)return toast("حذف ناموفق بود: "+error.message);
 toast("بازی حذف شد.");await loadData();go("admin");
}
async function deleteNews(id){
 if(!confirm("این خبر حذف شود؟"))return;
 if(!await checkAdmin())return toast("دسترسی مدیر تأیید نشد.");
 const {error}=await db.from("news").delete().eq("id",id);
 if(error)return toast("حذف ناموفق بود: "+error.message);
 toast("خبر حذف شد.");await loadData();go("admin");
}

db.auth.onAuthStateChange((_event,newSession)=>{
 session=newSession;
 if(currentPage==="admin")setTimeout(renderAdmin,0);
});
(async()=>{
 const {data,error}=await db.auth.getSession();
 if(error)console.error(error);
 session=data.session;
 await loadData();
 const hash=new URLSearchParams(location.hash.slice(1));
 if(hash.get("access_token")){
  history.replaceState(null,"",location.pathname+location.search);
  currentPage="admin";await renderAdmin();
 }
})();
</script>
</body>
</html>

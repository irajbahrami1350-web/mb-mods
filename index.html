<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MB MODS 🎮🛠️ ULTRA</title>

<style>
*{box-sizing:border-box}
:root{
 --p:#00eaff;
 --r:#ff1744;
 --g:#35ff7a;
 --y:#ffd740;
 --bg:#05060a;
 --card:#0c1119;
 --line:#1d2b3c
}
body{
 margin:0;
 background:
 radial-gradient(circle at 20% 0,#09243355,transparent 35%),
 var(--bg);
 color:#eee;
 font-family:Tahoma,Arial,sans-serif
}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
header{
 position:sticky;
 top:0;
 z-index:20;

 backdrop-filter:blur(15px);

}
.nav{
 max-width:1250px;
 margin:auto;
 padding:12px;
 display:flex;
 gap:10px;
 align-items:center;
 flex-wrap:wrap
}
.logo{
 font-size:22px;
 font-weight:1000;
 color:var(--p);
 text-shadow:0 0 20px #00eaff88
}
.navlinks{
 display:flex;
 gap:6px;
 flex-wrap:wrap;
 margin-right:auto
}
.navlinks button,.mini{
 background:#0d1622;
 color:#ddd;
 border:1px solid #23364c;
 border-radius:11px;
 padding:9px 11px
}
.navlinks button:hover,.mini:hover{
 border-color:var(--p);
 color:#fff
}
main{
 max-width:1250px;
 margin:auto;
 padding:25px 14px 80px
}
.hero{
 border:1px solid #244158;
 border-radius:28px;
 padding:38px 22px;
 background:
 radial-gradient(circle at 85% 15%,#ff174433,transparent 30%),
 radial-gradient(circle at 15% 90%,#00eaff25,transparent 35%),
 #090e16;
 box-shadow:0 0 60px #00eaff0c
}
.hero h1{
 font-size:clamp(35px,8vw,70px);
 margin:0
}
.hero h1 span{
 color:var(--r);
 text-shadow:0 0 25px #ff1744aa
}
.hero p{
 line-height:2;
 color:#aebaca
}
.actions{
 display:flex;
 gap:9px;
 flex-wrap:wrap
}
.btn{
 border:0;
 border-radius:13px;
 padding:11px 16px;
 background:linear-gradient(135deg,var(--p),#6578ff);
 font-weight:900;
 color:#001018
}
.btn.red{
 background:linear-gradient(135deg,#ff1744,#ff633d);
 color:#fff
}
.btn.dark{
 background:#101a28;
 color:#fff;
 border:1px solid #2a3b51
}
.section{margin-top:25px}
.grid{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(215px,1fr));
 gap:15px
}
.card,.pagebox{
 background:linear-gradient(180deg,#0d141e,#080c12);
 border:1px solid var(--line);
 border-radius:19px;
 padding:15px;
 box-shadow:0 12px 35px #0005
}
.card:hover{
 transform:translateY(-3px);
 border-color:#31516e
}
.cover{
 height:135px;
 border-radius:15px;
 background:linear-gradient(135deg,#142538,#080b11);
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:62px;
 overflow:hidden
}
.cover img{
 width:100%;
 height:100%;
 object-fit:cover
}
.tag{
 display:inline-block;
 background:#101d2b;
 border:1px solid #214357;
 color:var(--p);
 padding:4px 8px;
 border-radius:20px;
 font-size:11px;
 margin-top:9px
}
.price{
 font-size:20px;
 font-weight:900;
 color:var(--g);
 margin:10px 0
}
.old{
 text-decoration:line-through;
 color:#6e7887;
 font-size:12px
}
.muted{
 color:#8997a8;
 line-height:1.9;
 font-size:13px
}
.search{
 width:100%;
 padding:13px;
 background:#070b11;
 color:#fff;
 border:1px solid #263a51;
 border-radius:14px;
 margin:10px 0 16px;
 outline:none
}
.form{
 display:grid;
 gap:10px;
 max-width:850px
}
.form input,.form textarea,.form select{
 width:100%;
 background:#070b11;
 color:#fff;
 border:1px solid #263a51;
 border-radius:12px;
 padding:12px;
 outline:none
}
.form textarea{
 min-height:110px;
 resize:vertical
}
.two{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:10px
}
.notice{
 background:#101925;
 border:1px solid #26394f;
 border-radius:13px;
 padding:12px;
 margin:10px 0;
 line-height:1.9
}
.adminnav{
 display:flex;
 gap:7px;
 flex-wrap:wrap;
 margin-bottom:15px
}
table{
 width:100%;
 border-collapse:collapse
}
th,td{
 border-bottom:1px solid #1a2838;
 padding:10px;
 text-align:right;
 font-size:13px
}
th{color:var(--p)}
.ok{color:var(--g)}
.danger{color:#ff5872}
.modal{
 position:fixed;
 inset:0;
 background:#000c;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:15px;
 z-index:99
}
.modal>div{
 width:100%;
 max-width:650px;
 max-height:90vh;
 overflow:auto;
 background:#0b111a;
 border:1px solid #2b4762;
 border-radius:20px;
 padding:20px
}
.hidden{display:none!important}
.toast{
 position:fixed;
 bottom:18px;
 left:18px;
 z-index:999;
 background:#101a26;
 border:1px solid #29435c;
 border-radius:12px;
 padding:12px 16px;
 box-shadow:0 10px 30px #0008
}
footer{
 text-align:center;
 color:#647184;
 padding:30px
}
.stat{
 font-size:28px;
 color:var(--p);
 font-weight:1000
}
.discount{
 border:1px dashed #35ff7a66;
 background:#07170f;
 padding:12px;
 border-radius:14px;
 margin:10px 0
}
.vipbox{
 border:1px solid #5e4c13;
 background:
 radial-gradient(circle at 80% 0,#ffd74018,transparent 35%),
 #12100a
}
.vipprice{
 color:var(--y);
 font-size:23px;
 font-weight:1000
}
.small{
 font-size:11px;
 color:#718094
}
@media(max-width:650px){
 .nav{align-items:flex-start}
 .navlinks{width:100%;order:3}
 .navlinks button{flex:1;font-size:11px}
 .two{grid-template-columns:1fr}
 .grid{grid-template-columns:repeat(2,1fr)}
 .card{padding:10px}
 .cover{height:105px}
 table{display:block;overflow-x:auto}
}
</style>
</head>

<script>

/* =====================================================

const seedNews=[
{

 title:"🚨 شروع رسمی MB MODS",

 date:"1405/07/12"
},
{

 title:"🎮 بخش بازی‌ها فعال شد",
 text:"هر بازی می‌تواند صفحه اختصاصی، قیمت، مشخصات و راهنمای نصب داشته باشد.",
 date:"1405/07/13"
}
];

function get(k,d=[]){
 try{
  const x=JSON.parse(localStorage.getItem(k));
  return x??d;
 }catch(e){
  return d;
 }
}

function set(k,v){
 try{
  localStorage.setItem(k,JSON.stringify(v));
  return true;
 }catch(e){
  toast("حافظه مرورگر پر شده است ❌");
  return false;
 }
}

function esc(s=""){
 return String(s).replace(/[&<>"']/g,m=>({
  "&":"&amp;",
  "<":"&lt;",
  ">":"&gt;",
  '"':"&quot;",
  "'":"&#039;"
 }[m]));
}

function money(n){
 return Number(n)
 ? Number(n).toLocaleString("fa-IR")+" تومان"
 : "رایگان";
}

function go(h){
 location.hash=h;
}

function toast(x){
 const t=document.getElementById("toast");
 t.textContent=x;
 t.classList.remove("hidden");
 setTimeout(()=>t.classList.add("hidden"),2500);
}

function currentUser(){
 try{
  return JSON.parse(localStorage.mbUser||"null");
 }catch(e){
  return null;
 }
}

function isVip(){
 const u=currentUser();
 return !!(u&&u.vipUntil&&Number(u.vipUntil)>Date.now());
}

function vipRemaining(){
 const u=currentUser();
 if(!u?.vipUntil)return 0;
 return Math.max(0,Number(u.vipUntil)-Date.now());
}

function ensureData(){

 if(!localStorage[K.games]){
  set(K.games,seedGames);
 }

 if(!localStorage[K.news]){
  set(K.news,seedNews);
 }

 if(!localStorage[K.users]){
  set(K.users,[]);
 }

 if(!localStorage[K.orders]){
  set(K.orders,[]);
 }

 if(!localStorage[K.fav]){
  set(K.fav,[]);
 }

 if(!localStorage[K.coupons]){
  set(K.coupons,[]);
 }

 if(!localStorage[K.vip]){
  set(K.vip,[
   {
    id:1,
    title:"VIP یک ماهه",
    days:30,
    price:99000,
    downloads:30,
    description:"اشتراک VIP یک ماهه"
   },
   {
    id:2,
    title:"VIP سه ماهه",
    days:90,
    price:199000,
    downloads:100,
    description:"اشتراک VIP سه ماهه"
   }
  ]);
 }

 if(!localStorage[K.settings]){
  set(K.settings,{
   card:"",
   owner:"",
   account:"",
   phone:"",
   description:""
  });
 }

}

ensureData();


/* =====================================================
   HOME
   ===================================================== */

function home(){

 const games=get(K.games);
 const news=get(K.news);

 return `
 <section class="hero">

  <h1>MB <span>MODS</span> 🎮</h1>

  <p>

  طراحی شده برای موبایل و قابل مدیریت از داخل پنل مدیریت.
  </p>

  <div class="actions">
   <button class="btn red" onclick="go('#/games')">
    🔥 ورود به بازی‌ها
   </button>

   <button class="btn dark" onclick="go('#/news')">
    📰 آخرین اخبار
   </button>

   <button class="btn" onclick="go('#/vip')">
    👑 عضویت VIP
   </button>
  </div>

 </section>

 <div class="section">

  <h2>🔥 بازی‌های ویژه</h2>

  <div class="grid">
   ${games.slice(0,6).map(gameCard).join("")}
  </div>

 </div>

 <div class="section">

  <h2>⚡ آخرین اخبار</h2>

  <div class="grid">

   ${news.slice(0,4).map(n=>`

/* =====================================================
   GAME CARD
   ===================================================== */

function gameCard(g){

 return `
 <article class="card">

  <div class="cover">
   ${
    g.cover
    ?`<img src="${g.cover}" alt="">`
    :esc(g.icon||"🎮")
   }
  </div>

  <span class="tag">
   ${esc(g.genre||"گیم")} • ${esc(g.platform||"Android")}
  </span>

  <h3>${esc(g.title)}</h3>

  <p class="muted">
   ${esc(g.size||"—")} • نسخه ${esc(g.version||"—")}
  </p>

  <div class="price">

   ${money(g.price)}

   ${
    g.old
    ?`<span class="old">${money(g.old)}</span>`
    :""
   }

  </div>

  <p class="small">
   👁️ ${Number(g.views||0).toLocaleString("fa-IR")}
   • 📥 ${Number(g.downloads||0).toLocaleString("fa-IR")}
  </p>

  <button class="btn"
   onclick="go('#/games/${g.id}')">
   مشاهده بازی
  </button>

 </article>
 `;
}


/* =====================================================
   GAMES
   ===================================================== */

function games(){

 return `
 <h1>🎮 بازی‌ها</h1>

 <input class="search"
  placeholder="نام بازی، ژانر یا پلتفرم..."
  oninput="filterGames(this.value)">

 <div id="gameGrid" class="grid">
  ${get(K.games).map(gameCard).join("")}
 </div>
 `;
}

function filterGames(q){

 const x=q.toLowerCase();

 const g=get(K.games).filter(a=>
  (a.title+" "+a.genre+" "+a.platform)
  .toLowerCase()
  .includes(x)
 );

 document.getElementById("gameGrid").innerHTML=
  g.map(gameCard).join("")||
  `<div class="notice">چیزی پیدا نشد 😐</div>`;
}


/* =====================================================
   GAME DETAIL
   ===================================================== */

function gameDetail(id){

 const gs=get(K.games);
 const g=gs.find(x=>x.id==id);

 if(!g)return shell("خطا","بازی پیدا نشد.");

 /*
  افزایش بازدید
  حداکثر یک بار در هر 10 ثانیه
 */

 const key="mb_view_"+id;
 const last=Number(sessionStorage.getItem(key)||0);

 if(Date.now()-last>10000){

  g.views=Number(g.views||0)+1;

  set(K.games,gs);

  sessionStorage.setItem(key,String(Date.now()));
 }

 const fav=get(K.fav);

 return `
 <div class="pagebox">

  <div class="cover" style="height:230px">

   ${
    g.cover
    ?`<img src="${g.cover}">`
    :esc(g.icon||"🎮")
   }

  </div>

  <h1>${esc(g.title)}</h1>

  <p class="muted">
   ${esc(g.desc)}
  </p>

  <div class="two">

   <div>
    <b>ژانر:</b> ${esc(g.genre)}<br>
    <b>پلتفرم:</b> ${esc(g.platform)}<br>
    <b>نسخه:</b> ${esc(g.version)}
   </div>

   <div>
    <b>حجم:</b> ${esc(g.size)}<br>
    <b>بازدید:</b> ${Number(g.views||0).toLocaleString("fa-IR")}<br>
    <b>دانلود:</b> ${Number(g.downloads||0).toLocaleString("fa-IR")}
   </div>

  </div>

  <div class="price">

   ${money(g.price)}

   ${
    g.old
    ?`<span class="old">${money(g.old)}</span>`
    :""
   }

  </div>

  <div class="notice">

   <b>📘 راهنمای نصب:</b><br>

   ${esc(g.guide)}

  </div>

  ${
   g.price
   ?`

   <div class="discount">

    <b>🎟️ کد تخفیف</b>

    <p class="muted">
     اگر کد تخفیف داری اینجا وارد کن.
    </p>

    <div class="actions">

     <input
      id="coupon-${g.id}"
      class="search"
      style="margin:0"
      placeholder="مثلاً MB20">

     <button
      class="btn"
      onclick="applyCoupon(${g.id})">
      اعمال کد
     </button>

    </div>

    <div id="coupon-result-${g.id}"></div>

   </div>

   `
   :""
  }

  <div class="actions">

   ${
    g.price
    ?
    `<button class="btn red"
      onclick="buy(${g.id})">
      🛒 خرید و ثبت سفارش
     </button>`
    :
    `<button class="btn"
      onclick="freeDownload(${g.id})">
      📥 دریافت رایگان
     </button>`
   }

   <button class="btn dark"
    onclick="toggleFav(${g.id})">

    ${
     fav.includes(g.id)
     ?"💔 حذف از علاقه‌مندی"
     :"❤️ علاقه‌مندی"
    }

   </button>

  </div>

 </div>
 `;
}


/* =====================================================
   COUPONS
   ===================================================== */

function findCoupon(code){

 return get(K.coupons).find(c=>
  String(c.code).toUpperCase()===
  String(code).trim().toUpperCase() &&
  c.active!==false
 );
}

function couponForGame(id){

 try{

  const x=sessionStorage.getItem("mb_coupon_"+id);

  if(!x)return null;

  const c=JSON.parse(x);

  const real=findCoupon(c.code);

  if(!real)return null;

  if(real.expires && Date.now()>Number(real.expires)){
   return null;
  }

  return real;

 }catch(e){
  return null;
 }
}

function applyCoupon(id){

 const input=document.getElementById("coupon-"+id);

 if(!input)return;

 const code=input.value.trim();

 if(!code){
  toast("کد تخفیف را وارد کن.");
  return;
 }

 const c=findCoupon(code);

 if(!c){
  toast("کد تخفیف معتبر نیست ❌");
  return;
 }

 if(c.expires && Date.now()>Number(c.expires)){
  toast("این کد تخفیف منقضی شده است ❌");
  return;
 }

 const g=get(K.games).find(x=>x.id==id);

 if(!g)return;

 const discount=Math.min(
  Number(c.percent)||0,
  100
 );

 const final=Math.max(
  0,
  Math.round(g.price*(1-discount/100))
 );

 sessionStorage.setItem(
  "mb_coupon_"+id,
  JSON.stringify({code:c.code})
 );

 document.getElementById("coupon-result-"+id).innerHTML=`

  <div class="notice">

   ✅ کد
   <b>${esc(c.code)}</b>
   اعمال شد.

   <br>

   تخفیف:
   <b class="ok">${discount}%</b>

   <br>

   قیمت نهایی:
   <b class="price">${money(final)}</b>

  </div>

 `;

 toast("کد تخفیف اعمال شد 🎟️");
}

function clearCoupon(id){

 sessionStorage.removeItem("mb_coupon_"+id);

}


/* =====================================================
   FREE DOWNLOAD
   ===================================================== */

function freeDownload(id){

 const gs=get(K.games);
 const g=gs.find(x=>x.id==id);

 if(!g)return;

 if(!g.file){
  toast("لینک دانلود برای این محصول تنظیم نشده است.");
  return;
 }

 g.downloads=Number(g.downloads||0)+1;

 set(K.games,gs);

 window.open(g.file,"_blank");

 toast("دانلود شروع شد 📥");
}


/* =====================================================
   FAVORITES
   ===================================================== */

function toggleFav(id){

 let f=get(K.fav);

 f=f.includes(id)
  ?f.filter(x=>x!=id)
  :[...f,id];

 set(K.fav,f);

 toast("ذخیره شد ❤️");

 render();
}

function favorites(){

 const f=get(K.fav);

 const g=get(K.games)
  .filter(x=>f.includes(x.id));

 return `
 <h1>❤️ علاقه‌مندی‌ها</h1>

 <div class="grid">

  ${
   g.map(gameCard).join("")||
   `<div class="notice">
    هنوز بازی‌ای اضافه نکردی.
   </div>`
  }

 </div>
 `;
}

   NEWS
   ===================================================== */

function news(){

 return `
 <h1>📰 اخبار</h1>

 <div class="grid">

 ${get(K.news).map(n=>`

  <article class="card">

   <span class="tag">${esc(n.date)}</span>

   <h2>${esc(n.title)}</h2>

function formatRemaining(ms){

 let sec=Math.floor(ms/1000);

 const days=Math.floor(sec/86400);
 sec%=86400;

 const hours=Math.floor(sec/3600);
 sec%=3600;

 const mins=Math.floor(sec/60);

 return `${days} روز و ${hours} ساعت و ${mins} دقیقه`;
}

function statusText(s){

 return {

  pending:"منتظر پرداخت",

  review:"در حال بررسی رسید",

  paid:"پرداخت تأیید شد",

  rejected:"رسید رد شد"

 }[s]||s;
}


/* =====================================================
   RECEIPT
   ===================================================== */

function uploadReceipt(id){

 const input=document.createElement("input");

 input.type="file";
 input.accept="image/*,.pdf";

 input.onchange=()=>{

  const file=input.files[0];

  if(!file)return;

  if(file.size>1200*1024){

   toast("رسید باید کمتر از 1.2MB باشد.");

   return;
  }

  const reader=new FileReader();

  reader.onload=()=>{

   const os=get(K.orders);

   const o=os.find(x=>x.id==id);

   if(!o)return;

   o.receipt=reader.result;

   o.status="review";

   set(K.orders,os);

   toast("رسید ارسال شد ✅");

   render();
  };

  reader.readAsDataURL(file);
 };

 input.click();
}

function addCoupon(e){

 e.preventDefault();

 const code=
  document.getElementById("couponCode")
  .value.trim()
  .toUpperCase();

 const percent=
  Number(
   document.getElementById("couponPercent").value
  );

 const days=
  Number(
   document.getElementById("couponDays").value
  );

 if(percent<1||percent>100){

  toast("درصد تخفیف باید بین ۱ تا ۱۰۰ باشد.");

  return;
 }

 const cs=get(K.coupons);

 if(cs.some(x=>x.code===code)){

  toast("این کد قبلاً ساخته شده.");

  return;
 }

 let expires=0;

 if(days>0){

  expires=
   Date.now()+
   days*86400000;
 }

 cs.push({

  id:Date.now(),

  code:code,

  percent:percent,

  expires:expires,

  active:true

 });

 set(K.coupons,cs);

 toast("کد تخفیف ساخته شد 🎟️");

 go("#/admin/coupons");
}

/* =====================================================
   APPROVE ORDER
   ===================================================== */

function approveOrder(id){

 const os=get(K.orders);

 const o=os.find(x=>x.id==id);

 if(!o)return;

 o.status="paid";

 /*
  فروش محصول
 */

 if(o.type==="game"){

  const gs=get(K.games);

  const g=gs.find(x=>x.id==o.gameId);

  if(g){

   g.sales=
    Number(g.sales||0)+1;

   set(K.games,gs);
  }
 }

 /*
  فعال کردن VIP
 */

 if(o.type==="vip"){

  const users=get(K.users);

  const u=users.find(x=>
   x.id===o.userId ||
   x.name===o.user
  );

  if(u){

   const now=Date.now();

   const current=
    Number(u.vipUntil||0)>now
    ?Number(u.vipUntil)
    :now;

   u.vipUntil=
    current+
    Number(o.days||30)*86400000;

   u.vipDownloads=
    Number(o.downloads||0);

   set(K.users,users);

   /*
    اگر همان کاربر الان لاگین است
   */

   if(
    currentUser() &&
    (
     currentUser().id===u.id ||
     currentUser().name===u.name
    )
   ){

    localStorage.mbUser=
     JSON.stringify(u);
   }
  }
 }

 set(K.orders,os);

 toast("سفارش تأیید شد ✅");

 render();
}

 const os=get(K.orders);

function backupData(){

 const data={};

 Object.values(K).forEach(k=>{
  data[k]=get(k,[]);
 });

 const blob=new Blob(
  [JSON.stringify(data,null,2)],
  {type:"application/json"}
 );

 const url=URL.createObjectURL(blob);

 const a=document.createElement("a");

 a.href=url;

 a.download=
  "mb-mods-backup-"+Date.now()+".json";

 a.click();

 URL.revokeObjectURL(url);

 toast("بکاپ ساخته شد 💾");
}

function restoreData(e){

 const file=e.target.files[0];

 if(!file)return;

 const reader=new FileReader();

 reader.onload=()=>{

  try{

   const data=JSON.parse(reader.result);

   Object.values(K).forEach(k=>{

    if(data[k]!==undefined){

     set(k,data[k]);

    }

   });

   toast("بکاپ بازیابی شد ✅");

   render();

  }catch(err){

   toast("فایل بکاپ خراب است ❌");

  }

 };

 reader.readAsText(file);
}

function render(){

 const hash=
  location.hash||"#/home";

 const p=
  hash
  .replace(/^#\//,"")
  .split("/");

 let html="";

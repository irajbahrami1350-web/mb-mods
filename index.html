<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MB MODS 🎮🛠️ ULTRA PRO</title>

<style>
*{box-sizing:border-box}
:root{
 --p:#00eaff;--r:#ff1744;--g:#35ff7a;--y:#ffd740;
 --bg:#05060a;--card:#0c1119;--line:#1d2b3c
}
body{
 margin:0;background:radial-gradient(circle at 20% 0,#09243355,transparent 35%),var(--bg);
 color:#eee;font-family:Tahoma,Arial,sans-serif
}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
header{
 position:sticky;top:0;z-index:20;background:#060910ee;
 backdrop-filter:blur(15px);border-bottom:1px solid #203044
}
.nav{
 max-width:1250px;margin:auto;padding:12px;display:flex;
 gap:10px;align-items:center;flex-wrap:wrap
}
.logo{
 font-size:22px;font-weight:1000;color:var(--p);
 text-shadow:0 0 20px #00eaff88
}
.navlinks{
 display:flex;gap:6px;flex-wrap:wrap;margin-right:auto
}
.navlinks button,.mini{
 background:#0d1622;color:#ddd;border:1px solid #23364c;
 border-radius:11px;padding:9px 11px
}
.navlinks button:hover,.mini:hover{border-color:var(--p);color:#fff}
main{max-width:1250px;margin:auto;padding:25px 14px 80px}
.hero{
 border:1px solid #244158;border-radius:28px;padding:38px 22px;
 background:radial-gradient(circle at 85% 15%,#ff174433,transparent 30%),
 radial-gradient(circle at 15% 90%,#00eaff25,transparent 35%),#090e16;
 box-shadow:0 0 60px #00eaff0c
}
.hero h1{font-size:clamp(35px,8vw,70px);margin:0}
.hero h1 span{color:var(--r);text-shadow:0 0 25px #ff1744aa}
.hero p{line-height:2;color:#aebaca}
.actions{display:flex;gap:9px;flex-wrap:wrap}
.btn{
 border:0;border-radius:13px;padding:11px 16px;
 background:linear-gradient(135deg,var(--p),#6578ff);
 font-weight:900;color:#001018
}
.btn.red{background:linear-gradient(135deg,#ff1744,#ff633d);color:#fff}
.btn.dark{background:#101a28;color:#fff;border:1px solid #2a3b51}
.btn.green{background:linear-gradient(135deg,#35ff7a,#00c853);color:#001018}
.btn.yellow{background:linear-gradient(135deg,#ffd740,#ffab00);color:#211600}
.section{margin-top:25px}
.grid{
 display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:15px
}
.card,.pagebox{
 background:linear-gradient(180deg,#0d141e,#080c12);
 border:1px solid var(--line);border-radius:19px;padding:15px;
 box-shadow:0 12px 35px #0005
}
.card:hover{transform:translateY(-3px);border-color:#31516e}
.cover{
 height:135px;border-radius:15px;background:linear-gradient(135deg,#142538,#080b11);
 display:flex;align-items:center;justify-content:center;font-size:62px;overflow:hidden
}
.cover img{width:100%;height:100%;object-fit:cover}
.tag{
 display:inline-block;background:#101d2b;border:1px solid #214357;color:var(--p);
 padding:4px 8px;border-radius:20px;font-size:11px;margin-top:9px
}
.price{font-size:20px;font-weight:900;color:var(--g);margin:10px 0}
.old{text-decoration:line-through;color:#6e7887;font-size:12px}
.muted{color:#8997a8;line-height:1.9;font-size:13px}
.search{
 width:100%;padding:13px;background:#070b11;color:#fff;
 border:1px solid #263a51;border-radius:14px;margin:10px 0 16px;outline:none
}
.form{display:grid;gap:10px;max-width:850px}
.form input,.form textarea,.form select{
 width:100%;background:#070b11;color:#fff;border:1px solid #263a51;
 border-radius:12px;padding:12px;outline:none
}
.form textarea{min-height:110px;resize:vertical}
.form input:focus,.form textarea:focus,.form select:focus{border-color:var(--p)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.notice{
 background:#101925;border:1px solid #26394f;border-radius:13px;
 padding:12px;margin:10px 0;line-height:1.9
}
.adminnav{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:15px}
table{width:100%;border-collapse:collapse}
th,td{border-bottom:1px solid #1a2838;padding:10px;text-align:right;font-size:13px}
th{color:var(--p)}
.ok{color:var(--g)}
.danger{color:#ff5872}
.modal{
 position:fixed;inset:0;background:#000c;display:flex;align-items:center;
 justify-content:center;padding:15px;z-index:99
}
.modal>div{
 width:100%;max-width:650px;max-height:90vh;overflow:auto;
 background:#0b111a;border:1px solid #2b4762;border-radius:20px;padding:20px
}
.hidden{display:none!important}
.toast{
 position:fixed;bottom:18px;left:18px;z-index:999;background:#101a26;
 border:1px solid #29435c;border-radius:12px;padding:12px 16px;
 box-shadow:0 10px 30px #0008
}
.stats{
 display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px
}
.stat{
 background:#0a121c;border:1px solid #1d3449;border-radius:16px;padding:15px
}
.stat b{display:block;font-size:24px;color:var(--p);margin-top:5px}
.productStats{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.productStats span{
 font-size:11px;background:#0a1722;border:1px solid #1c3a4d;
 padding:5px 7px;border-radius:9px;color:#aab7c7
}
.discountBox{
 background:#0a1722;border:1px solid #29485e;
 border-radius:14px;padding:12px;margin:15px 0
}
.discountBox input{
 background:#070b11;color:#fff;border:1px solid #263a51;
 border-radius:10px;padding:10px;width:100%
}
.vipCard{
 border:1px solid #543f12;
 background:linear-gradient(145deg,#171208,#0c1018);
 border-radius:18px;padding:18px
}
.vipCard h2{color:var(--y)}
.bigNumber{font-size:30px;font-weight:1000;color:var(--g)}
@media(max-width:650px){
 .nav{align-items:flex-start}
 .navlinks{width:100%;order:3}
 .navlinks button{flex:1;font-size:11px}
 .two{grid-template-columns:1fr}
 .grid{grid-template-columns:repeat(2,1fr)}
 .card{padding:10px}
 .cover{height:105px}
 table{display:block;overflow-x:auto}
}
</style>
</head>

<body>

<header>
<div class="nav">
<div class="logo">MB MODS 🎮🛠️</div>
<div class="navlinks">
<button onclick="go('#/home')">🏠 خانه</button>
<button onclick="go('#/games')">🎮 بازی‌ها</button>
<button onclick="go('#/news')">📰 اخبار</button>

<main id="app"></main>

<script>

/* =========================================================
   MB MODS ULTRA PRO
   ========================================================= */

const K={
 games:"mb_games",
 news:"mb_news",
 users:"mb_users",
 orders:"mb_orders",
 settings:"mb_settings",
 fav:"mb_fav",
 coupons:"mb_coupons",
 vip:"mb_vip"

const seedGames=[

},

 vipOnly:false
},
{
 id:3,

 icon:"👨‍🚀",
 genre:"Party",
 platform:"Android",
 version:"Latest",

 size:"—",
 cover:"",
 desc:"محصول نمونه.",

 file:"",
 downloads:0,
 views:0,
 sales:0,
 vipOnly:false
}
];

const seedNews=[
{id:1,title:"🚨 شروع رسمی MB MODS",text:"به MB MODS خوش آمدید؛ اخبار بازی و محصولات جدید اینجا منتشر می‌شوند.",date:"1405/07/12"},
{id:2,title:"🎮 بخش بازی‌ها فعال شد",text:"هر بازی می‌تواند صفحه اختصاصی، قیمت، مشخصات و راهنمای نصب داشته باشد.",date:"1405/07/13"}
];

const seedVip=[
{id:1,title:"VIP یک ماهه",days:30,price:99000,maxDownloads:20,description:"دسترسی VIP به محصولات ویژه"},
{id:2,title:"VIP سه ماهه",days:90,price:199000,maxDownloads:100,description:"دسترسی VIP سه ماهه با دانلود بیشتر"}
];

function get(k,d=[]){
 try{return JSON.parse(localStorage.getItem(k)) ?? d}
 catch(e){return d}
}

function set(k,v){
 try{
  localStorage.setItem(k,JSON.stringify(v));
  return true
 }catch(e){
  toast("حافظه مرورگر پر شده است ❌");
  return false
 }
}

function esc(s=""){
 return String(s).replace(/[&<>"']/g,m=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",
 '"':"&quot;","'":"&#039;"
 }[m]));
}

function money(n){
 return Number(n)?Number(n).toLocaleString("fa-IR")+" تومان":"رایگان";
}

function go(h){
 location.hash=h;
}

function toast(x){
 const t=document.getElementById("toast");
 t.textContent=x;
 t.classList.remove("hidden");
 setTimeout(()=>t.classList.add("hidden"),2500);
}

function currentUser(){
 try{return JSON.parse(localStorage.mbUser||"null")}
 catch(e){return null}
}

function saveCurrentUser(u){
 localStorage.mbUser=JSON.stringify(u);
 const us=get(K.users);
 const i=us.findIndex(x=>x.id==u.id);
 if(i>=0){
  us[i]=u;
  set(K.users,us);
 }
}

function isVip(){
 const u=currentUser();
 return !!(u && Number(u.vipUntil)>Date.now());
}

function vipRemaining(){
 const u=currentUser();
 if(!u?.vipUntil)return 0;
 return Math.max(0,Number(u.vipUntil)-Date.now());
}

function formatDays(ms){
 return Math.ceil(ms/86400000);
}

function getCoupon(code){
 if(!code)return null;
 const c=get(K.coupons).find(x=>
  String(x.code).toUpperCase()===String(code).trim().toUpperCase()
 );
 if(!c)return null;
 if(c.expires && new Date(c.expires).getTime()<Date.now())return null;
 if(c.limit>0 && Number(c.used||0)>=Number(c.limit))return null;
 return c;
}

function couponDiscount(c,price){
 if(!c)return 0;
 if(c.type==="fixed")return Math.min(price,Number(c.value)||0);
 return Math.min(price,Math.floor(price*(Number(c.value)||0)/100));
}

function getAppliedCoupon(id){
 try{
  const x=JSON.parse(sessionStorage.getItem("mb_coupon_"+id)||"null");
  if(!x)return null;
  return getCoupon(x.code);
 }catch(e){return null}
}

function applyCoupon(id){
 const input=document.getElementById("coupon_"+id);
 if(!input)return;

 const code=input.value.trim();
 const c=getCoupon(code);

 if(!c){
  toast("کد تخفیف معتبر نیست ❌");
  return;
 }

 try{
  sessionStorage.setItem(
   "mb_coupon_"+id,
   JSON.stringify({code:c.code})
  );
 }catch(e){}

 toast("کد تخفیف اعمال شد 🎟️");
 render();
}

function clearCoupon(id){
 try{sessionStorage.removeItem("mb_coupon_"+id)}catch(e){}
 render();
}

/* =========================
   INIT
========================= */

if(!localStorage[K.games])set(K.games,seedGames);
if(!localStorage[K.news])set(K.news,seedNews);
if(!localStorage[K.users])set(K.users,[]);
if(!localStorage[K.orders])set(K.orders,[]);
if(!localStorage[K.fav])set(K.fav,[]);
if(!localStorage[K.coupons])set(K.coupons,[]);
if(!localStorage[K.vip])set(K.vip,seedVip);

if(!localStorage[K.settings])set(K.settings,{
 card:"",
 owner:"",
 account:"",
 phone:"",
 description:""
});

/* مهاجرت محصولات قدیمی */

(function migrate(){
 const gs=get(K.games);
 let changed=false;

 gs.forEach(g=>{
  if(typeof g.views!=="number"){g.views=0;changed=true}
  if(typeof g.downloads!=="number"){g.downloads=0;changed=true}
  if(typeof g.sales!=="number"){g.sales=0;changed=true}
  if(typeof g.vipOnly!=="boolean"){g.vipOnly=false;changed=true}
 });

 if(changed)set(K.games,gs);
})();

/* =========================
   HOME
========================= */

function home(){

 const games=get(K.games);
 const news=get(K.news);

 return `
 <section class="hero">
  <h1>MB <span>MODS</span> 🎮</h1>

  <p>
   پورتال گیمینگ خفن برای معرفی بازی، مود، اخبار و محصولات دیجیتال.
   طراحی شده برای موبایل و قابل مدیریت از داخل پنل مدیریت.
  </p>

  <div class="actions">
   <button class="btn red" onclick="go('#/games')">🔥 ورود به بازی‌ها</button>
   <button class="btn dark" onclick="go('#/news')">📰 آخرین اخبار</button>
   <button class="btn yellow" onclick="go('#/vip')">👑 عضویت VIP</button>
  </div>
 </section>

 <div class="section">
  <h2>🔥 بازی‌های ویژه</h2>
  <div class="grid">
   ${games.slice(0,6).map(gameCard).join("")}
  </div>
 </div>

 <div class="section">
  <h2>⚡ آخرین اخبار</h2>
  <div class="grid">
   ${news.slice(0,4).map(n=>`
    <article class="card">
     <span class="tag">${esc(n.date)}</span>
     <h3>${esc(n.title)}</h3>
     <p class="muted">${esc(n.text)}</p>
     <button class="mini" onclick="go('#/news/${n.id}')">ادامه ←</button>
    </article>
   `).join("")}
  </div>
 </div>
 `;
}

/* =========================
   GAME CARD
========================= */

function gameCard(g){

 return `
 <article class="card">

  <div class="cover">
   ${g.cover?`<img src="${esc(g.cover)}" alt="">`:esc(g.icon||"🎮")}
  </div>

  <span class="tag">
   ${esc(g.genre||"بازی")} • ${esc(g.platform||"نامشخص")}
  </span>

  ${g.vipOnly?`<span class="tag" style="color:#ffd740">👑 VIP</span>`:""}

  <h3>${esc(g.title)}</h3>

  <p class="muted">
   ${esc(g.size||"—")} • نسخه ${esc(g.version||"—")}
  </p>

  <div class="productStats">
   <span>👁️ ${Number(g.views||0).toLocaleString("fa-IR")}</span>
   <span>📥 ${Number(g.downloads||0).toLocaleString("fa-IR")}</span>
   <span>💰 ${Number(g.sales||0).toLocaleString("fa-IR")}</span>
  </div>

  <div class="price">
   ${money(g.price)}
   ${g.old?`<span class="old">${money(g.old)}</span>`:""}
  </div>

  <button class="btn" onclick="go('#/games/${g.id}')">
   مشاهده بازی
  </button>

 </article>
 `;
}

/* =========================
   GAMES
========================= */

function games(){

 return `
 <h1>🎮 بازی‌ها</h1>

 <input class="search"
  placeholder="نام بازی، ژانر یا پلتفرم..."
  oninput="filterGames(this.value)">

 <div id="gameGrid" class="grid">
  ${get(K.games).map(gameCard).join("")}
 </div>
 `;
}

function filterGames(q){

 const x=q.toLowerCase();

 const g=get(K.games).filter(a=>
  (a.title+" "+a.genre+" "+a.platform)
  .toLowerCase()
  .includes(x)
 );

 document.getElementById("gameGrid").innerHTML=
  g.map(gameCard).join("")||
  `<div class="notice">چیزی پیدا نشد 😐</div>`;
}

/* =========================
   GAME DETAIL
========================= */

function gameDetail(id){

 const g=get(K.games).find(x=>x.id==id);

 if(!g)return shell("خطا","بازی پیدا نشد.");

 /* افزایش بازدید */
 const viewKey="mb_last_view_"+id;
 const last=Number(sessionStorage.getItem(viewKey)||0);

 if(Date.now()-last>30000){
  g.views=Number(g.views||0)+1;

  const gs=get(K.games);
  const i=gs.findIndex(x=>x.id==g.id);
  if(i>=0){
   gs[i]=g;
   set(K.games,gs);
  }

  sessionStorage.setItem(viewKey,String(Date.now()));
 }

 const fav=get(K.fav);
 const coupon=getAppliedCoupon(g.id);

 let finalPrice=Number(g.price)||0;
 let discount=0;

 if(coupon){
  discount=couponDiscount(coupon,finalPrice);
  finalPrice=Math.max(0,finalPrice-discount);
 }

 if(g.vipOnly && !isVip()){
  return `
  <div class="pagebox">

   <div class="cover" style="height:230px">
    ${g.cover?`<img src="${esc(g.cover)}">`:esc(g.icon||"👑")}
   </div>

   <h1>${esc(g.title)}</h1>

   <div class="notice">
    👑 این محصول فقط برای اعضای VIP قابل دریافت است.
   </div>

   <button class="btn yellow" onclick="go('#/vip')">
    👑 مشاهده اشتراک‌های VIP
   </button>

   <button class="btn dark" onclick="go('#/games')">
    بازگشت
   </button>

  </div>
  `;
 }

 return `
 <div class="pagebox">

  <div class="cover" style="height:230px">
   ${g.cover?`<img src="${esc(g.cover)}">`:esc(g.icon||"🎮")}
  </div>

  <h1>${esc(g.title)}</h1>

  <p class="muted">${esc(g.desc)}</p>

  <div class="productStats">
   <span>👁️ ${Number(g.views||0).toLocaleString("fa-IR")} بازدید</span>
   <span>📥 ${Number(g.downloads||0).toLocaleString("fa-IR")} دانلود</span>
   <span>💰 ${Number(g.sales||0).toLocaleString("fa-IR")} فروش</span>
  </div>

  <div class="two">

   <div>
    <b>ژانر:</b> ${esc(g.genre)}<br>
    <b>پلتفرم:</b> ${esc(g.platform)}
   </div>

   <div>
    <b>نسخه:</b> ${esc(g.version)}<br>
    <b>حجم:</b> ${esc(g.size)}
   </div>

  </div>

  <div class="price">
   ${money(finalPrice)}
   ${g.old?`<span class="old">${money(g.old)}</span>`:""}
  </div>

  ${coupon?`
   <div class="notice">
    🎟️ کد <b>${esc(coupon.code)}</b> اعمال شد.
    تخفیف:
    <b class="ok">${money(discount)}</b>
    <button class="mini" onclick="clearCoupon(${g.id})">حذف کد</button>
   </div>
  `:g.price?`
   <div class="discountBox">

    <b>🎟️ کد تخفیف داری؟</b>

    <div class="two" style="margin-top:10px">
     <input id="coupon_${g.id}" placeholder="مثلاً MB20">
     <button class="btn green" onclick="applyCoupon(${g.id})">
      اعمال کد
     </button>
    </div>

   </div>
  `:""}

  <div class="notice">
   <b>📘 راهنمای نصب:</b><br>
   ${esc(g.guide)}
  </div>

  <div class="actions">

   ${
    g.price
    ?
    `<button class="btn red" onclick="buy(${g.id})">
      🛒 خرید و ثبت سفارش
     </button>`
    :
    `<button class="btn green" onclick="freeDownload(${g.id})">
      📥 دریافت رایگان
     </button>`
   }

   <button class="btn dark" onclick="toggleFav(${g.id})">
    ${fav.includes(g.id)?"💔 حذف از علاقه‌مندی":"❤️ علاقه‌مندی"}
   </button>

  </div>

 </div>
 `;
}

/* =========================
   DOWNLOAD
========================= */

function freeDownload(id){

 const gs=get(K.games);
 const g=gs.find(x=>x.id==id);

 if(!g)return;

 if(g.vipOnly&&!isVip()){
  toast("این محصول مخصوص VIP است 👑");
  go("#/vip");
  return;
 }

 if(!g.file){
  toast("لینک دانلود توسط مدیریت ثبت نشده است.");
  return;
 }

 g.downloads=Number(g.downloads||0)+1;
 set(K.games,gs);

 window.open(g.file,"_blank","noopener");
}

/* =========================
   FAVORITES
========================= */

function toggleFav(id){

 let f=get(K.fav);

 f=f.includes(id)
  ?f.filter(x=>x!=id)

/* =========================
   RECEIPT
========================= */

function uploadReceipt(id){

 const input=document.createElement("input");

 input.type="file";
 input.accept="image/*,.pdf";

 input.onchange=()=>{

  const file=input.files[0];

  if(!file)return;

  if(file.size>1200*1024){
   toast("رسید باید کمتر از 1.2MB باشد.");
   return;
  }

  const reader=new FileReader();

  reader.onload=()=>{

   const os=get(K.orders);
   const o=os.find(x=>x.id==id);

   if(!o)return;

   o.receipt=reader.result;
   o.status="review";

   set(K.orders,os);

   toast("رسید ارسال شد ✅");
   render();
  };

  reader.readAsDataURL(file);
 };

 input.click();
}

function showReceipt(id){

 const o=get(K.orders).find(x=>x.id==id);

 if(!o?.receipt){
  toast("رسیدی وجود ندارد.");
  return;
 }

 const w=window.open();

 if(!w){
  toast("مرورگر اجازه پنجره جدید نداد.");
  return;
 }

 w.document.write(`
 <title>رسید ${id}</title>
 <body style="background:#111;color:white;text-align:center">
 <h2>رسید سفارش ${id}</h2>

 `);
}

function approveOrder(id){

 const os=get(K.orders);
 const o=os.find(x=>x.id==id);

 if(!o)return;

 o.status="paid";

 /* اگر سفارش بازی است */
 if(o.type==="game"){

  const gs=get(K.games);
  const g=gs.find(x=>x.id==o.gameId);

  if(g){
   g.sales=Number(g.sales||0)+1;
   set(K.games,gs);
  }
 }

 /* اگر سفارش VIP است */
 if(o.type==="vip"){

  const us=get(K.users);
  const u=us.find(x=>x.id==o.userId);

  if(u){

   const now=Date.now();
   const old=Number(u.vipUntil||0);
   const start=old>now?old:now;

   u.vipUntil=
    start+
    Number(o.days||30)*86400000;

   u.vipDownloads=0;

   set(K.users,us);

   if(currentUser()?.id==u.id){
    localStorage.mbUser=JSON.stringify(u);
   }
  }
 }

 set(K.orders,os);

 toast("سفارش تأیید شد ✅");
 render();
}

function rejectOrder(id){

 const os=get(K.orders);
 const o=os.find(x=>x.id==id);

 if(!o)return;

 o.status="rejected";

 set(K.orders,os);

 toast("سفارش رد شد ❌");
 render();
}

function downloadProduct(id){

 const os=get(K.orders);
 const o=os.find(x=>x.id==id);

 if(!o){
  toast("سفارش پیدا نشد.");
  return;
 }

 if(o.status!=="paid"){
  toast("ابتدا باید سفارش تأیید شود.");
  return;
 }

 const u=currentUser();

 if(!u){
  toast("ابتدا وارد حساب شوید.");
  go("#/login");
  return;
 }

 if(o.userId && o.userId!=u.id){
  toast("این سفارش متعلق به این حساب نیست.");
  return;
 }

 const g=get(K.games).find(x=>x.id==o.gameId);

 if(!g?.file){
  toast("لینک دانلود محصول ثبت نشده است.");
  return;
 }

 const gs=get(K.games);
 const real=gs.find(x=>x.id==g.id);

 if(real){
  real.downloads=Number(real.downloads||0)+1;
  set(K.games,gs);
 }

 window.open(g.file,"_blank","noopener");
}

function addCoupon(e){

 e.preventDefault();

 const code=document.getElementById("cCode")
  .value.trim().toUpperCase();

 const cs=get(K.coupons);

 if(cs.some(x=>String(x.code).toUpperCase()===code)){
  toast("این کد قبلاً ساخته شده است.");
  return;
 }

 const type=document.getElementById("cType").value;
 const value=Number(document.getElementById("cValue").value)||0;

 if(type==="percent"&&value>100){
  toast("درصد نمی‌تواند بیشتر از 100 باشد.");
  return;
 }

 cs.push({
  id:Date.now(),
  code,
  type,
  value,
  limit:Number(document.getElementById("cLimit").value)||0,
  used:0,
  expires:document.getElementById("cExpire").value||""
 });

 set(K.coupons,cs);

 toast("کد تخفیف ساخته شد 🎟️");
 go("#/admin/coupons");
}

}

function adminBackup(){

 return `
 <div class="pagebox">

 <div class="actions">

  <button class="btn" onclick="backupData()">
   📥 دریافت بکاپ
  </button>

  <label class="btn dark">
   📤 بازگردانی بکاپ
   <input
    type="file"
    accept=".json,application/json"
    style="display:none"
    onchange="restoreData(this)">
  </label>

 </div>

 </div>
 `;
}

function backupData(){

 const data={};

 Object.values(K).forEach(k=>{
  data[k]=get(k);
 });

 const blob=new Blob(
  [JSON.stringify(data,null,2)],
  {type:"application/json"}
 );

 const a=document.createElement("a");

 a.href=URL.createObjectURL(blob);
 a.download="mb-mods-backup.json";

 a.click();

 setTimeout(()=>URL.revokeObjectURL(a.href),1000);

 toast("بکاپ آماده شد 💾");
}

function restoreData(input){

 const file=input.files[0];

 if(!file)return;

 const r=new FileReader();

 r.onload=()=>{

  try{

   const data=JSON.parse(r.result);

   Object.values(K).forEach(k=>{
    if(data[k]!==undefined)set(k,data[k]);
   });

   toast("بکاپ بازگردانی شد ✅");
   render();

  }catch(e){
   toast("فایل بکاپ معتبر نیست ❌");
  }

 };

 r.readAsText(file);
}

 else if(p[0]==="login")

  html=register();

 else if(p[0]==="orders")
  html=orders();

 else if(p[0]==="vip")
  html=vipPage();

 else if(p[0]==="profile")
  html=profile();

 else if(p[0]==="admin"&&!p[1])
  html=admin();

  if(!localStorage.mbAdmin){
   go("#/admin/login");
   return;
  }

  html=adminGames();

 }

 else if(p[0]==="admin"&&p[1]==="news"){

  if(!localStorage.mbAdmin){
   go("#/admin/login");
   return;
  }

  html=adminNews();

 }

 else if(p[0]==="admin"&&p[1]==="orders"){

  if(!localStorage.mbAdmin){
   go("#/admin/login");
   return;
  }

  html=adminOrders();

 }

 else if(p[0]==="admin"&&p[1]==="coupons"){

   return;
  }

 }

 else if(p[0]==="admin"&&p[1]==="vip"){

  if(!localStorage.mbAdmin){

  html=adminVip();

 }

 else if(p[0]==="admin"&&p[1]==="users"){

   return;

 }

 else if(p[0]==="admin"&&p[1]==="settings"){

 else if(p[0]==="admin"&&p[1]==="backup"){

 }

 else

 document.getElementById("app").innerHTML=html;

 window.scrollTo(0,0);
}
